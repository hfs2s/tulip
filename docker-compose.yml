# Tulip — the deployment topology.
#
# This file is where the containment actually lives. The application code
# assumes the properties declared here and would be unsafe without them, so it
# is worth reading as a security document rather than as configuration:
#
#   · tulip-agent has NO route to the internet (tulip-lan is `internal: true`)
#   · tulip-agent has NO working DNS (its resolver is 127.0.0.1, where nothing
#     listens) — which closes DNS tunnelling, the usual way out of a proxy jail
#   · tulip-agent and tulip-bridge share NO network at all; their entire
#     interface is two volumes with opposite permissions
#   · the WhatsApp credentials are mounted in exactly one container
#   · every service is non-root, read-only, capability-free and unprivileged
#
# Changing any of it changes docs/THREAT-MODEL.md. Update both in one commit.

name: tulip

x-hardening: &hardening
  # Applied to all three services. Being the trusted side of a boundary is not
  # a reason to be the soft one — the bridge holds the credentials, so it is the
  # most valuable target here, not the least.
  read_only: true
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  init: true
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

networks:
  # Reaches the internet. The bridge needs it for WhatsApp; the proxy needs it
  # to be a proxy.
  wan:
    driver: bridge

  # Does not. `internal: true` means Docker installs no default route in the
  # namespace, so packets aimed at the internet are dropped by the kernel rather
  # than by a policy something could be talked out of. The subnet is fixed so
  # the proxy can be given a static address to pin.
  lan:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.31.240.0/24

volumes:
  # WhatsApp credentials and bridge state. Mounted in tulip-bridge and nowhere
  # else. This single line is the largest security improvement over the design
  # Tulip is forked from, where the agent could read the auth store with `cat`.
  state:

  # The handoff. Two volumes rather than one, because the permissions differ:
  # the read-only inbound mount is what makes it impossible for the agent to
  # forge a batch, rewrite the current-turn pointer, or replay an old turn.
  handoff-in:
  handoff-out:

  # The agent's home: per-chat workspaces, Claude Code config and transcripts.
  # Mounted in tulip-agent and nowhere else.
  workspace:

services:
  # ── The trusted half ────────────────────────────────────────────────────────
  bridge:
    <<: *hardening
    container_name: tulip-bridge
    build:
      context: .
      target: bridge
    networks: [wan]
    environment:
      # Deliberately here and not in the agent. The agent asks for a GIF by
      # search phrase; the bridge does the searching, so the key never enters
      # the container the threat model assumes an attacker owns, and no new
      # host is added to the egress allowlist. See bridge/src/giphy.ts.
      # g | pg | pg-13 | r — enforced where the agent cannot reach it.
      # Web search and page reading, for the same reason and on the same terms:
      # the agent asks, the bridge performs. Rotated on rate limits. See
      # bridge/src/exa.ts for why `fetch` is not an HTTP request from here.
      # Pictures and speech, same terms: the agent asks, the bridge produces.
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      MINIMAX_GROUP_ID: ${MINIMAX_GROUP_ID:-}
      MINIMAX_VOICE_ID: ${MINIMAX_VOICE_ID:-}
      MINIMAX_BASE_URL: ${MINIMAX_BASE_URL:-}
      # `${VAR:-}` sets these to the *empty string*, not to unset. Everything
      # reading them goes through `env()` in minimax.ts, which treats empty as
      # absent — `??` does not, and that is how an empty MINIMAX_BASE_URL turned
      # every request into a relative URL and silently disabled pictures and
      # voice notes for weeks.
      MINIMAX_VOICE_MODEL: ${MINIMAX_VOICE_MODEL:-}
      MINIMAX_IMAGE_MODEL: ${MINIMAX_IMAGE_MODEL:-}
      # Only the 2.5 speech models accept this; 02 and 01 reject it outright, so
      # move it and MINIMAX_VOICE_MODEL together.
      MINIMAX_LANGUAGE_BOOST: ${MINIMAX_LANGUAGE_BOOST:-}
      # happy | sad | angry | fearful | disgusted | surprised | neutral, or
      # `none` to speak flat. Anything else is dropped rather than sent: the
      # provider rejects an unknown emotion with a 400 and takes the whole voice
      # note with it, and a typo should cost the warmth, not the reply.
      MINIMAX_VOICE_EMOTION: ${MINIMAX_VOICE_EMOTION:-}
      # Transcription for inbound voice notes, read by the BRIDGE. The one
      # capability MiniMax cannot provide — it synthesises speech and does not
      # recognise it, and every transcription endpoint on that account 404s — so
      # this is the single deliberate exception to "MiniMax only". Narrow by
      # construction: one file in, one string out, used for nothing else. The key
      # never enters the agent's container. Unset simply means voice notes arrive
      # as audio the agent will say it cannot hear. See bridge/src/transcribe.ts.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_TRANSCRIBE_MODEL: ${OPENAI_TRANSCRIBE_MODEL:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      EXA_API_KEY: ${EXA_API_KEY:-}
      EXA_BACKUP_API_KEY: ${EXA_BACKUP_API_KEY:-}
      EXA_BACKUP_API_KEY2: ${EXA_BACKUP_API_KEY2:-}
      # Cloudflare Access, when the panel is published behind it. Both are
      # required together: the AUD tag is what binds an assertion to *this*
      # application, and without it a token minted for any other app on the same
      # Cloudflare account would be accepted here. Unset disables Access auth
      # entirely and leaves the bearer token as the only way in. Neither value
      # is a secret — the tag is an identifier, and the checking is done against
      # Cloudflare's published keys.
      # The hostname pages are served on. It must NOT be the panel's: agent-authored
      # JavaScript served from the panel's origin would be same-origin with the
      # operator's session, and one fetch('/api/settings') from a page you opened
      # would carry your cookie. Unset means the agent cannot publish at all,
      # which is the correct behaviour rather than a degraded one.
      TULIP_PAGES_HOST: ${TULIP_PAGES_HOST:-}
      TULIP_ACCESS_TEAM_DOMAIN: ${TULIP_ACCESS_TEAM_DOMAIN:-}
      TULIP_ACCESS_AUD: ${TULIP_ACCESS_AUD:-}
    volumes:
      - state:/state
      - handoff-in:/handoff/in
      - handoff-out:/handoff/out
      # The agent's home, READ-ONLY, so the panel's Chat page can render the
      # agent's own Claude Code transcript as a conversation instead of an
      # operator reading a raw tmux pane.
      #
      # Read the header of bridge/src/transcript.ts before touching this; the
      # short version is that it buys no trust and is not meant to. These files
      # are on the agent's read-write volume, so a compromised agent can rewrite
      # them — the transcript has exactly the standing of status.json, which is
      # displayed and never decided from. What the mount buys is that the
      # parsing, the caps and the escaping all happen on the trusted side, and
      # that shipping the feature does not mean recreating tulip-agent and
      # killing every live conversation.
      #
      # `:ro` is not the control that matters. The control is that a symlink the
      # agent plants under /workspace is resolved in the BRIDGE's namespace,
      # where /state holds the WhatsApp credentials — so transcript.ts opens
      # with O_NOFOLLOW and checks /proc/self/fd, exactly as outbox.ts does for
      # the outbound file path. Never add a reader here that resolves by name.
      - workspace:/workspace:ro
      # The agent's real terminal. ttyd runs on the *host* and `docker exec`s
      # into the agent; this is only the socket it listens on. The agent gains
      # nothing from it — no port, no route, nothing added to its image — and
      # the bridge gains one socket rather than `docker.sock`. See
      # scripts/tulip-ttyd.sh for why it is a socket and not a port.
      #
      # Optional: without it the Terminal page answers 503 and says so.
      - /run/tulip:/run/tulip
      # A directory, not the file. The root filesystem is read-only, so binding
      # just `config.json` leaves `/config` itself unwritable — and an atomic
      # write creates a temporary sibling before renaming it into place, which
      # then fails with EROFS. Mounting the directory gives the rename somewhere
      # to happen. The agent has no mount of either.
      - ./config:/config
    tmpfs:
      - /tmp:mode=1777,size=64m,noexec,nosuid,nodev
    ports:
      # The publish address is the control on who can reach the panel — not the
      # app's bind address, which is 0.0.0.0 inside the container by necessity.
      #
      # Loopback by default. Set TULIP_PANEL_BIND to a specific interface when
      # something else must reach it — a Cloudflare tunnel on another host, say
      # — and put an authenticating proxy in front when you do. Never 0.0.0.0:
      # that publishes an operator console to every network the host is on.
      - "${TULIP_PANEL_BIND:-127.0.0.1}:8791:8791"
    mem_limit: 768m
    pids_limit: 256
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(require('node:fs').existsSync('/state/bridge.lock') ? 0 : 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ── The untrusted half ──────────────────────────────────────────────────────
  agent:
    <<: *hardening
    container_name: tulip-agent
    build:
      context: .
      target: agent
    depends_on:
      - egress
    networks: [lan]

    # No usable resolver. Nothing listens on 127.0.0.1:53 inside this container,
    # so every external name lookup fails immediately. This is what closes DNS
    # tunnelling — an HTTP-proxy-only jail with working DNS is not a jail.
    dns:
      - 127.0.0.1

    # The one name it needs, pinned rather than resolved.
    extra_hosts:
      - "egress:172.31.240.10"

    environment:
      # The only credential in this container, and the only one that has to be.
      # Whichever is used, it is reachable by anyone who achieves code execution
      # here — the threat model assumes they do — so it should be dedicated and
      # capped rather than a credential that unlocks anything else.
      #
      # Set EITHER ANTHROPIC_API_KEY (Anthropic direct) OR ANTHROPIC_AUTH_TOKEN
      # with ANTHROPIC_BASE_URL (an Anthropic-compatible provider). The unused
      # ones arrive as empty strings, which the supervisor strips before the
      # tmux server inherits them — an empty base URL is not the same as none.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_AUTH_TOKEN: ${ANTHROPIC_AUTH_TOKEN:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      # Some Anthropic-compatible models think by default and spend the whole
      # token budget on reasoning, returning an empty reply. Set to 0 for those.
      MAX_THINKING_TOKENS: ${MAX_THINKING_TOKENS:-}
      HTTPS_PROXY: http://egress:3128
      HTTP_PROXY: http://egress:3128
      # Belt and braces: even if something ignored the proxy variables, there is
      # no route for it to use.
      NO_PROXY: ""
      TULIP_MODEL: ${TULIP_MODEL:-}
      TULIP_MAX_LIVE_SESSIONS: ${TULIP_MAX_LIVE_SESSIONS:-3}
      TULIP_SESSION_IDLE_MS: ${TULIP_SESSION_IDLE_MS:-1800000}

    volumes:
      # Read-only. The agent may read its batches and the media it was sent; it
      # may not write here, so it cannot forge or tamper with either.
      - handoff-in:/handoff/in:ro
      # Read-write: this is how it speaks.
      - handoff-out:/handoff/out
      - workspace:/workspace

    tmpfs:
      # nosuid and nodev, but *not* noexec. The agent can already execute code
      # by design — it has node and a shell — so noexec here would buy nothing
      # while breaking ordinary tool use. The controls that matter are that
      # there is nothing to steal and nowhere to send it.
      - /tmp:mode=1777,size=512m,nosuid,nodev

    mem_limit: 3g
    pids_limit: 512
    cpus: 3.0

  # ── The one hole in the wall ────────────────────────────────────────────────
  egress:
    <<: *hardening
    container_name: tulip-egress
    build:
      context: .
      target: egress
    networks:
      lan:
        ipv4_address: 172.31.240.10
      wan:
    environment:
      # Deny-by-default: an unset or empty list refuses every CONNECT. Add hosts
      # only with a reason, and note that each one is a channel out of the jail.
      # These two are the minimum for Claude Code to start — inference, and the
      # entitlement check it makes at launch. See .env.example.
      TULIP_EGRESS_ALLOW: ${TULIP_EGRESS_ALLOW:-api.anthropic.com,platform.claude.com}
      TULIP_EGRESS_MAX_TUNNELS: ${TULIP_EGRESS_MAX_TUNNELS:-32}
    tmpfs:
      - /tmp:mode=1777,size=16m,noexec,nosuid,nodev
    mem_limit: 128m
    pids_limit: 64
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3128/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
