# Tulip — the deployment topology.
#
# This file is where the containment actually lives. The application code
# assumes the properties declared here and would be unsafe without them, so it
# is worth reading as a security document rather than as configuration:
#
#   · tulip-agent has NO route to the internet (tulip-lan is `internal: true`)
#   · tulip-agent has NO working DNS (its resolver is 127.0.0.1, where nothing
#     listens) — which closes DNS tunnelling, the usual way out of a proxy jail
#   · tulip-agent and tulip-bridge share NO network at all; their entire
#     interface is two volumes with opposite permissions
#   · the WhatsApp credentials are mounted in exactly one container
#   · every service is non-root, read-only, capability-free and unprivileged
#   · tulip-browser renders pages from anywhere and is treated like the agent:
#     untrusted, on its own `internal: true` network whose only other member is
#     tulip-webproxy, no working DNS, and no network shared with the bridge —
#     the two talk through two volumes, exactly as the bridge and the agent do
#
# Changing any of it changes docs/THREAT-MODEL.md. Update both in one commit.

# One codebase, several agents. Each deployment is its own compose project —
# its own containers, volumes, WhatsApp number, network and panel — and every
# default below is the original single deployment's, so a checkout with no
# instance variables set is exactly what it always was. See docs/INSTANCES.md
# and scripts/2lp, which is how a second one is run and how a change reaches all
# of them at once.
name: ${TULIP_INSTANCE:-tulip}

x-hardening: &hardening
  # Applied to every service. Being the trusted side of a boundary is not
  # a reason to be the soft one — the bridge holds the credentials, so it is the
  # most valuable target here, not the least.
  read_only: true
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  init: true
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

networks:
  # Reaches the internet. The bridge needs it for WhatsApp; the proxy needs it
  # to be a proxy.
  wan:
    driver: bridge

  # Does not. `internal: true` means Docker installs no default route in the
  # namespace, so packets aimed at the internet are dropped by the kernel rather
  # than by a policy something could be talked out of. The subnet is fixed so
  # the proxy can be given a static address to pin.
  lan:
    driver: bridge
    internal: true
    ipam:
      config:
        # Distinct per instance: two projects cannot share an internal subnet.
        - subnet: ${TULIP_LAN_SUBNET:-172.31.240.0/24}

  # The browser's network. Internal like `lan`, for the same reason — no default
  # route, so nothing leaves except through the proxy — and separate from it on
  # purpose: the browser and the agent have no business reaching each other, and
  # a proxy whose allowlist is `*` must never be reachable from the agent. The
  # subnet is fixed so the browser can be given its proxy as an address; it has
  # no DNS to look up a name with.
  #
  # Distinct per instance, like `lan`, and deliberately outside the 172.31.24x
  # range instances take their `lan` from: the first version of this hard-coded
  # 172.31.241.0/24, which is exactly the second instance's `lan`, and Docker
  # refuses overlapping pools — `up` would have failed halfway through.
  web:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: ${TULIP_WEB_SUBNET:-172.31.250.0/24}

volumes:
  # WhatsApp credentials and bridge state. Mounted in tulip-bridge and nowhere
  # else. This single line is the largest security improvement over the design
  # Tulip is forked from, where the agent could read the auth store with `cat`.
  state:

  # The handoff. Two volumes rather than one, because the permissions differ:
  # the read-only inbound mount is what makes it impossible for the agent to
  # forge a batch, rewrite the current-turn pointer, or replay an old turn.
  handoff-in:
  handoff-out:

  # The agent's home: per-chat workspaces, Claude Code config and transcripts.
  # Mounted in tulip-agent and nowhere else.
  workspace:

  # The browser's handoff, in the same shape as the agent's and for the same
  # reason: the bridge writes one request per page into `browse-req`, which the
  # browser mounts read-only; the browser writes its answer into `browse-res`.
  # This is the whole interface between them — no shared network, because the
  # bridge's panel listens on 0.0.0.0 inside its container. See
  # shared/src/browse.ts and bridge/src/browse.ts.
  browse-req:
  browse-res:

services:
  # ── The trusted half ────────────────────────────────────────────────────────
  bridge:
    <<: *hardening
    container_name: ${TULIP_INSTANCE:-tulip}-bridge
    # Named, and the same name for every instance: the images are the code, and
    # the code is shared. `scripts/2lp deploy` builds once and recreates every
    # instance, which is what keeps them from running different versions.
    image: tulip-bridge:latest
    build:
      context: .
      target: bridge
    networks: [wan]
    environment:
      # The clock every human-facing timestamp is rendered from.
      #
      # Both containers default to Etc/UTC while the Pi is Europe/Madrid, so
      # until this was set the terminal read 12:01 with 14:02 on the wall clock
      # beside it. Nothing on disk changes: every stored timestamp is an ISO
      # instant or epoch milliseconds, both TZ-independent by construction, so
      # this moves what a person reads and not what is written. Storage stays
      # UTC on purpose — it is the only form that is unambiguous across DST.
      TZ: ${TULIP_TIMEZONE:-Europe/Madrid}
      # Web search and page reading, deliberately here and not in the agent:
      # the agent asks, the bridge performs, so the key never enters the
      # container the threat model assumes an attacker owns and no host is
      # added to the egress allowlist. Rotated on rate limits. See
      # bridge/src/exa.ts for why `fetch` is not an HTTP request from here.
      # Pictures and speech, same terms: the agent asks, the bridge produces.
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      MINIMAX_GROUP_ID: ${MINIMAX_GROUP_ID:-}
      MINIMAX_VOICE_ID: ${MINIMAX_VOICE_ID:-}
      MINIMAX_BASE_URL: ${MINIMAX_BASE_URL:-}
      # `${VAR:-}` sets these to the *empty string*, not to unset. Everything
      # reading them goes through `env()` in minimax.ts, which treats empty as
      # absent — `??` does not, and that is how an empty MINIMAX_BASE_URL turned
      # every request into a relative URL and silently disabled pictures and
      # voice notes for weeks.
      MINIMAX_VOICE_MODEL: ${MINIMAX_VOICE_MODEL:-}
      MINIMAX_IMAGE_MODEL: ${MINIMAX_IMAGE_MODEL:-}
      # The other picture provider. It is the one that takes reference images,
      # so a request naming pictures goes here whatever the preference says.
      # The key stays on this side, as every provider credential does.
      APIMART_API_KEY: ${APIMART_API_KEY:-}
      APIMART_IMAGE_MODEL: ${APIMART_IMAGE_MODEL:-}
      APIMART_IMAGE_SIZE: ${APIMART_IMAGE_SIZE:-}
      APIMART_IMAGE_RESOLUTION: ${APIMART_IMAGE_RESOLUTION:-}
      TULIP_IMAGE_PROVIDER: ${TULIP_IMAGE_PROVIDER:-}
      # Only the 2.5 speech models accept this; 02 and 01 reject it outright, so
      # move it and MINIMAX_VOICE_MODEL together.
      MINIMAX_LANGUAGE_BOOST: ${MINIMAX_LANGUAGE_BOOST:-}
      # happy | sad | angry | fearful | disgusted | surprised | neutral, or
      # `none` to speak flat. Anything else is dropped rather than sent: the
      # provider rejects an unknown emotion with a 400 and takes the whole voice
      # note with it, and a typo should cost the warmth, not the reply.
      MINIMAX_VOICE_EMOTION: ${MINIMAX_VOICE_EMOTION:-}
      # Transcription for inbound voice notes, read by the BRIDGE. The one
      # capability MiniMax cannot provide — it synthesises speech and does not
      # recognise it, and every transcription endpoint on that account 404s — so
      # this is the single deliberate exception to "MiniMax only". Narrow by
      # construction: one file in, one string out, used for nothing else. The key
      # never enters the agent's container. Unset simply means voice notes arrive
      # as audio the agent will say it cannot hear. See bridge/src/transcribe.ts.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_TRANSCRIBE_MODEL: ${OPENAI_TRANSCRIBE_MODEL:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      EXA_API_KEY: ${EXA_API_KEY:-}
      EXA_BACKUP_API_KEY: ${EXA_BACKUP_API_KEY:-}
      EXA_BACKUP_API_KEY2: ${EXA_BACKUP_API_KEY2:-}
      # Cloudflare Access, when the panel is published behind it. Both are
      # required together: the AUD tag is what binds an assertion to *this*
      # application, and without it a token minted for any other app on the same
      # Cloudflare account would be accepted here. Unset disables Access auth
      # entirely and leaves the bearer token as the only way in. Neither value
      # is a secret — the tag is an identifier, and the checking is done against
      # Cloudflare's published keys.
      # The hostname pages are served on. It must NOT be the panel's: agent-authored
      # JavaScript served from the panel's origin would be same-origin with the
      # operator's session, and one fetch('/api/settings') from a page you opened
      # would carry your cookie. Unset means the agent cannot publish at all,
      # which is the correct behaviour rather than a degraded one.
      TULIP_PAGES_HOST: ${TULIP_PAGES_HOST:-}
      # Where the pages host sends anyone arriving at its root. Unset answers
      # 404, which is right: the root is not a landing page, and a deployment
      # that has not named a destination should not send visitors to one.
      TULIP_PAGES_ROOT_REDIRECT: ${TULIP_PAGES_ROOT_REDIRECT:-}
      TULIP_ACCESS_TEAM_DOMAIN: ${TULIP_ACCESS_TEAM_DOMAIN:-}
      TULIP_ACCESS_AUD: ${TULIP_ACCESS_AUD:-}
      # Where this panel answers from the outside. Used for one thing: a
      # refused panel reached over the tailnet can point at the address where
      # signing in actually works. It cannot work that out for itself, because
      # on that path Cloudflare — which is what would know — is not involved.
      TULIP_PANEL_HOST: ${TULIP_PANEL_HOST:-}
      # Which deployment this is, for the panel and the operator commands. The
      # name is display-only: what the agent is told it is lives in the persona.
      TULIP_INSTANCE: ${TULIP_INSTANCE:-tulip}
      TULIP_AGENT_NAME: ${TULIP_AGENT_NAME:-}
      # `fetch` in a real browser: 1 to ask tulip-browser first and fall back to
      # Exa, unset to use Exa alone exactly as before. The bridge never dials the
      # URL either way; see bridge/src/browse.ts.
      TULIP_BROWSER: ${TULIP_BROWSER:-}
      # Which platform this instance is on, and the Teams bot's credentials
      # when it is Teams. The secret stays on this side like every other one;
      # the agent container is not handed it and could not use it if it were.
      # The bind and port are NOT passed through: inside the container the
      # Teams listener is 0.0.0.0:8792 for the reason `panel.host` gives, and
      # the two variables are the host-side publish line below.
      TULIP_TRANSPORT: ${TULIP_TRANSPORT:-whatsapp}
      # Pair by code rather than by camera. The phone's own number, digits only
      # — a QR is valid for about twenty seconds, which is not long enough to
      # relay to somebody on the other end of an ssh session.
      TULIP_PAIR_NUMBER: ${TULIP_PAIR_NUMBER:-}
      TULIP_TEAMS_APP_ID: ${TULIP_TEAMS_APP_ID:-}
      TULIP_TEAMS_APP_SECRET: ${TULIP_TEAMS_APP_SECRET:-}
      TULIP_TEAMS_TENANT_ID: ${TULIP_TEAMS_TENANT_ID:-}
    volumes:
      - state:/state
      - handoff-in:/handoff/in
      - handoff-out:/handoff/out
      # The agent's home, READ-ONLY, so the panel's Chat page can render the
      # agent's own Claude Code transcript as a conversation instead of an
      # operator reading a raw tmux pane.
      #
      # Read the header of bridge/src/transcript.ts before touching this; the
      # short version is that it buys no trust and is not meant to. These files
      # are on the agent's read-write volume, so a compromised agent can rewrite
      # them — the transcript has exactly the standing of status.json, which is
      # displayed and never decided from. What the mount buys is that the
      # parsing, the caps and the escaping all happen on the trusted side, and
      # that shipping the feature does not mean recreating tulip-agent and
      # killing every live conversation.
      #
      # `:ro` is not the control that matters. The control is that a symlink the
      # agent plants under /workspace is resolved in the BRIDGE's namespace,
      # where /state holds the WhatsApp credentials — so transcript.ts opens
      # with O_NOFOLLOW and checks /proc/self/fd, exactly as outbox.ts does for
      # the outbound file path. Never add a reader here that resolves by name.
      - workspace:/workspace:ro
      # The agent's real terminal. ttyd runs on the *host* and `docker exec`s
      # into the agent; this is only the socket it listens on. The agent gains
      # nothing from it — no port, no route, nothing added to its image — and
      # the bridge gains one socket rather than `docker.sock`. See
      # scripts/tulip-ttyd.sh for why it is a socket and not a port.
      #
      # Optional: without it the Terminal page answers 503 and says so.
      - ${TULIP_HOST_RUN:-/run/tulip}:/run/tulip
      # A directory, not the file. The root filesystem is read-only, so binding
      # just `config.json` leaves `/config` itself unwritable — and an atomic
      # write creates a temporary sibling before renaming it into place, which
      # then fails with EROFS. Mounting the directory gives the rename somewhere
      # to happen. The agent has no mount of either.
      - ${TULIP_HOST_CONFIG:-./config}:/config
      # Plugins: services on the host that send through this number. One
      # directory per plugin; the bridge sends what they drop there, within what
      # config.json grants each one. Mounted here and nowhere else — the agent
      # has no path to it, so no conversation can become a plugin action. See
      # bridge/src/plugins.ts and docs/PLUGINS.md.
      - ${TULIP_HOST_PLUGINS:-./plugins}:/plugins
      # The browser's handoff. Read-write here: the bridge writes requests and
      # deletes answers. Everything it reads from `browse-res` was written by a
      # process that renders hostile pages, so bridge/src/browse.ts opens it with
      # O_NOFOLLOW for the same reason outbox.ts does — a symlink planted there
      # resolves in THIS namespace, next to the WhatsApp credentials.
      - browse-req:/browse/req
      - browse-res:/browse/res
    tmpfs:
      - /tmp:mode=1777,size=64m,noexec,nosuid,nodev
    ports:
      # The publish address is the control on who can reach the panel — not the
      # app's bind address, which is 0.0.0.0 inside the container by necessity.
      #
      # Loopback by default. Set TULIP_PANEL_BIND to a specific interface when
      # something else must reach it — a Cloudflare tunnel on another host, say
      # — and put an authenticating proxy in front when you do. Never 0.0.0.0:
      # that publishes an operator console to every network the host is on.
      - "${TULIP_PANEL_BIND:-127.0.0.1}:${TULIP_PANEL_PORT:-8791}:8791"
      # The Teams endpoint, on its own listener and its own publish line. It
      # is deliberately not the panel's: the panel sits behind Cloudflare
      # Access and Microsoft's bot service cannot sign in to that, so this one
      # is routed with no Access policy and the request's signed token is its
      # authentication. Published unconditionally — on a WhatsApp instance
      # nothing listens inside, and a loopback port with nothing behind it is
      # harmless — so that switching transports is one variable, not two.
      - "${TULIP_TEAMS_BIND:-127.0.0.1}:${TULIP_TEAMS_PORT:-8792}:8792"
    mem_limit: 768m
    pids_limit: 256
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(require('node:fs').existsSync('/state/bridge.lock') ? 0 : 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ── The untrusted half ──────────────────────────────────────────────────────
  agent:
    <<: *hardening
    container_name: ${TULIP_INSTANCE:-tulip}-agent
    image: tulip-agent:latest
    build:
      context: .
      target: agent
    depends_on:
      - egress
    networks: [lan]

    # No usable resolver. Nothing listens on 127.0.0.1:53 inside this container,
    # so every external name lookup fails immediately. This is what closes DNS
    # tunnelling — an HTTP-proxy-only jail with working DNS is not a jail.
    dns:
      - 127.0.0.1

    # The one name it needs, pinned rather than resolved.
    extra_hosts:
      - "egress:${TULIP_EGRESS_IP:-172.31.240.10}"

    environment:
      # The agent's own clock, and the reason it is not left at the default.
      #
      # `date` in the session read UTC while the people it is talking to are two
      # hours ahead, so a request for "9am" became 9am UTC and would have
      # arrived at 11am for them — on time by the agent's clock and late by
      # everyone else's, with nothing recording the disagreement. The scheduler
      # carries an explicit zone per entry; this is so the shell and the model
      # agree with it rather than quietly working in a third one.
      TZ: ${TULIP_TIMEZONE:-Europe/Madrid}
      # The only credential in this container, and the only one that has to be.
      # Whichever is used, it is reachable by anyone who achieves code execution
      # here — the threat model assumes they do — so it should be dedicated and
      # capped rather than a credential that unlocks anything else.
      #
      # Set EITHER ANTHROPIC_API_KEY (Anthropic direct) OR ANTHROPIC_AUTH_TOKEN
      # with ANTHROPIC_BASE_URL (an Anthropic-compatible provider). The unused
      # ones arrive as empty strings, which the supervisor strips before the
      # tmux server inherits them — an empty base URL is not the same as none.
      # Or a third way: a subscription OAuth token from `claude setup-token`,
      # which Claude Code reads instead of either of the above. It is the least
      # capped of the three — it unlocks a person's Claude account rather than a
      # dedicated key — so it is the one most worth revoking if this container
      # is ever suspected. See docs/THREAT-MODEL.md.
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_AUTH_TOKEN: ${ANTHROPIC_AUTH_TOKEN:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      # Some Anthropic-compatible models think by default and spend the whole
      # token budget on reasoning, returning an empty reply. Set to 0 for those.
      MAX_THINKING_TOKENS: ${MAX_THINKING_TOKENS:-}
      HTTPS_PROXY: http://egress:3128
      HTTP_PROXY: http://egress:3128
      # Belt and braces: even if something ignored the proxy variables, there is
      # no route for it to use.
      NO_PROXY: ""
      TULIP_MODEL: ${TULIP_MODEL:-}
      TULIP_MAX_LIVE_SESSIONS: ${TULIP_MAX_LIVE_SESSIONS:-3}
      TULIP_SESSION_IDLE_MS: ${TULIP_SESSION_IDLE_MS:-1800000}
      # How long one turn may run before the supervisor interrupts it. It has to
      # be listed here or it can never reach this container, and the agent sits
      # on its hardcoded default however the box .env is edited. With a single
      # shared session this is not a per-chat inconvenience: the wedged turn
      # holds the only window, so everybody waits it out.
      TULIP_TURN_TIMEOUT_MS: ${TULIP_TURN_TIMEOUT_MS:-}

    volumes:
      # Read-only. The agent may read its batches and the media it was sent; it
      # may not write here, so it cannot forge or tamper with either.
      - handoff-in:/handoff/in:ro
      # Read-write: this is how it speaks.
      - handoff-out:/handoff/out
      - workspace:/workspace

    tmpfs:
      # nosuid and nodev, but *not* noexec. The agent can already execute code
      # by design — it has node and a shell — so noexec here would buy nothing
      # while breaking ordinary tool use. The controls that matter are that
      # there is nothing to steal and nowhere to send it.
      - /tmp:mode=1777,size=512m,nosuid,nodev

    mem_limit: 3g
    pids_limit: 512
    cpus: 3.0

  # ── The one hole in the wall ────────────────────────────────────────────────
  egress:
    <<: *hardening
    container_name: ${TULIP_INSTANCE:-tulip}-egress
    image: tulip-egress:latest
    build:
      context: .
      target: egress
    networks:
      lan:
        ipv4_address: ${TULIP_EGRESS_IP:-172.31.240.10}
      wan:
    environment:
      # Deny-by-default: an unset or empty list refuses every CONNECT. Add hosts
      # only with a reason, and note that each one is a channel out of the jail.
      # These two are the minimum for Claude Code to start — inference, and the
      # entitlement check it makes at launch. See .env.example.
      TULIP_EGRESS_ALLOW: ${TULIP_EGRESS_ALLOW:-api.anthropic.com,platform.claude.com}
      TULIP_EGRESS_MAX_TUNNELS: ${TULIP_EGRESS_MAX_TUNNELS:-32}
    tmpfs:
      - /tmp:mode=1777,size=16m,noexec,nosuid,nodev
    mem_limit: 128m
    pids_limit: 64
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3128/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── The browser's way out ───────────────────────────────────────────────────
  # The same image as tulip-egress, with one difference that matters: the
  # allowlist is `*`, any public hostname. A browser that could only visit named
  # sites could not check a link somebody sent. Everything else is unchanged —
  # port 443 only, every resolved address refused if it is private, loopback,
  # link-local, CGNAT or Tailscale (egress/src/addresses.ts), every decision
  # logged. It is on `wan` to be a proxy and on `web` to be reachable. It is not
  # on `lan`, so the agent cannot use it to get round its own, shorter list.
  webproxy:
    <<: *hardening
    container_name: ${TULIP_INSTANCE:-tulip}-webproxy
    # Opt-in per instance: `COMPOSE_PROFILES=browser` in that instance's env
    # file. Without it `up` creates neither this nor the browser, so an instance
    # that has not chosen a browser is not handed one by somebody else's deploy.
    profiles: [browser]
    build:
      context: .
      target: egress
    networks:
      web:
        ipv4_address: ${TULIP_WEBPROXY_IP:-172.31.250.10}
      wan:
    environment:
      # Exactly `*`. allowlist.ts refuses `**`, `*.` and friends rather than
      # reading them as "everything", so a typo here fails loudly at startup.
      TULIP_EGRESS_ALLOW: ${TULIP_WEBPROXY_ALLOW:-*}
      # A page is dozens of connections; one page at a time keeps this far below
      # the limit. The limit is for a browser that has stopped behaving.
      TULIP_EGRESS_MAX_TUNNELS: ${TULIP_WEBPROXY_MAX_TUNNELS:-48}
      # Browser tunnels are short-lived. A minute idle is plenty.
      TULIP_EGRESS_IDLE_MS: "60000"
    tmpfs:
      - /tmp:mode=1777,size=16m,noexec,nosuid,nodev
    mem_limit: 128m
    pids_limit: 64
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3128/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── The second untrusted container ──────────────────────────────────────────
  # Headless Chromium, one page at a time. It renders anything, so it is
  # contained exactly like the agent: its only network is `web`, it cannot
  # resolve a name, it shares no network with the bridge or the agent, and it
  # holds nothing. See docs/THREAT-MODEL.md §T9 and browser/src/chromium.ts.
  browser:
    <<: *hardening
    container_name: ${TULIP_INSTANCE:-tulip}-browser
    profiles: [browser]
    build:
      context: .
      target: browser
    depends_on:
      - webproxy
    networks: [web]

    # No usable resolver, as for the agent. Chromium hands the hostname to the
    # proxy in the CONNECT line and never needs to look one up itself.
    dns:
      - 127.0.0.1

    environment:
      TZ: ${TULIP_TIMEZONE:-Europe/Madrid}
      # An address, not a name: there is no DNS to resolve one with. The
      # browser refuses to start without it rather than trying to go direct.
      TULIP_BROWSER_PROXY: http://${TULIP_WEBPROXY_IP:-172.31.250.10}:3128
      # Chromium's default user agent says "HeadlessChrome", which some sites
      # challenge. Unset keeps it honest; set it if that turns out to matter.
      TULIP_BROWSER_USER_AGENT: ${TULIP_BROWSER_USER_AGENT:-}

    volumes:
      - browse-req:/browse/req:ro
      - browse-res:/browse/res

    tmpfs:
      # Per-page profiles live here and are deleted after each page. Sized, and
      # the size is a real limit even on the Pi: tmpfs enforces it itself,
      # unlike mem_limit below. Not noexec: under --disable-dev-shm-usage
      # Chromium keeps its shared memory here, and a process that already runs
      # arbitrary JavaScript gains nothing from noexec that would justify the
      # risk of a browser that will not start.
      - /tmp:mode=1777,size=256m,nosuid,nodev

    # NOT ENFORCED on the Pi. Raspberry Pi OS ships with the memory cgroup
    # controller disabled, and Docker drops this with one warning line at
    # startup (THREAT-MODEL.md R6). It is here for hosts that have it. What
    # actually protects the Pi is in browser/src/chromium.ts: one page at a
    # time, SIGKILL to the process group at 20 seconds, a JavaScript heap cap
    # and a single renderer.
    mem_limit: 1g
    pids_limit: 128
    cpus: 2.0
    healthcheck:
      # The heartbeat the bridge also reads: touched every five seconds while
      # the loop is alive.
      test: ["CMD", "node", "-e", "process.exit(Date.now()-require('node:fs').statSync('/browse/res/.alive').mtimeMs<30000?0:1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
