<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Tulip</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<!-- Vendored at build time, same-origin like everything else. Absent in a
     development tree that has not run the asset build; the Terminal page
     checks for the emulator and says so rather than rendering a black box. -->
<link rel="stylesheet" href="/xterm.css">
<style>
  /* Vendored at image build time. The fallback stacks carry the page on their
     own when the files are absent, which they are in a development tree. */
  @font-face{font-family:'Onest';src:url('/fonts/onest.woff2') format('woff2');
             font-weight:100 900;font-display:swap}
  @font-face{font-family:'InterVar';src:url('/fonts/inter.woff2') format('woff2');
             font-weight:100 900;font-display:swap}

  :root{
    --ground:#0d0d0f; --panel:#111113; --raise:#141416;
    --line:rgba(255,255,255,.09); --line-soft:rgba(255,255,255,.055);
    --ink:#fafafa; --dim:rgba(250,250,250,.64); --faint:rgba(250,250,250,.42);
    --accent:#21d2ed; --accent-dim:rgba(33,210,237,.14);
    --warn:#f0b429; --bad:#ff6b6b;
    --display:'Onest',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    --body:'InterVar',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --rail:236px; --r-card:14px; --r-pill:999px;
  }

  *{box-sizing:border-box}
  html,body{height:100%}

  /* Paper.
     The texture is Paper Shaders' `paperTexture`, mounted once at speed 0 — it
     is a static surface, so there is no render loop and it costs one draw. It
     replaced a tiled SVG turbulence, which could give grain but not fibre,
     speckle or the slow unevenness of real stock, and which read as dots rather
     than tooth at any size that was actually visible.

     Fixed to the viewport rather than sized to the document: a canvas covering
     the full scroll height of a long log page is a large allocation for a
     texture nobody is measuring against the content. */
  /* The grain belongs to the content column, not the window — but it is fixed to
     the viewport rather than absolute inside `.page-wrap`, so it stays put while
     the page scrolls over it.
     Absolute was the obvious reading of "put it in page-wrap" and it does not
     work: the canvas is sized to the element's *box*, which in a scrolling flex
     column is one screenful, so the background simply ended partway down and
     everything below it was bare ground. Sizing it to the full scroll height
     would mean a canvas several screens tall, redrawn on every resize, to show
     one screenful at a time. */
  #paper{position:fixed;top:0;right:0;bottom:0;left:var(--rail);
         z-index:0;pointer-events:none}
  /* Two layers, because they do different jobs. `flow` is the neuro field and
     is the only thing moving; `grain` is the paper texture over the top, which
     is what stops a slow gradient reading as a screen artefact. Opacities are
     the tuning knob — the shaders are configured near-black already, and these
     take them the rest of the way down. */
  #paper > div{position:absolute;inset:0}
  #paper-flow{opacity:1}
  /* `soft-light`, not opacity. The grain is a near-black texture, so stacking it
     over the gradient at any useful strength simply covered it — a curtain
     rather than a surface. Blended, it modulates what is underneath instead of
     hiding it, which is what "paper over a colour" actually means. */
  #paper-grain{opacity:.55;mix-blend-mode:soft-light}
  #paper canvas{display:block;width:100%;height:100%}
  /* Content sits above the grain. */
  .rail,main{position:relative}
  .page-wrap > .page{position:relative;z-index:1}
  body{margin:0;background:var(--ground);color:var(--ink);
       font:400 14.5px/1.6 var(--body);font-variant-numeric:tabular-nums;
       -webkit-font-smoothing:antialiased;display:flex;overflow:hidden}

  /* The rail itself does not scroll; its nav does. With `overflow-y:auto` on
     the whole column, `margin-top:auto` on the footer put the agent block —
     and the terminal — below the fold on a short window, which is a way of
     hiding a control rather than a way of fitting it. The list is the part
     that can afford to scroll; who is answering, and the way in to them,
     should be on screen whatever the window is doing. */
  .rail{width:var(--rail);flex:0 0 var(--rail);height:100%;
        background:var(--panel);border-right:1px solid var(--line-soft);
        padding:22px 14px;overflow:hidden;display:flex;flex-direction:column;gap:3px}
  .rail nav{display:flex;flex-direction:column;gap:3px;overflow-y:auto;min-height:0}
  /* The mark sits on the word's baseline, not on its centre. Two things make
     that true, and the second is the one that is easy to miss:

     `align-items:baseline` aligns the boxes — a flex item with no text of its
     own takes its bottom edge as its baseline. But the artwork did not fill its
     box. The viewBox was `0 0 32 32` while the tulip occupied y 4.6 to 26.6, so
     5.4 units of empty space sat below it and the shape floated 4.39px above
     the letters however the boxes were aligned. The viewBox is now the artwork's
     own bounds, so the element's bottom edge *is* the tulip's bottom edge.

     Consequently the mark is no longer square: 17.03 x 22, and every width and
     height for it must keep that ratio or it letterboxes back to where it was. */
  .brand{display:flex;align-items:baseline;gap:10px;padding:0 10px 30px}
  .brand svg{width:13.9px;height:18px;flex:0 0 13.9px;display:block}
  .brand b{font:400 19px/1 var(--display);letter-spacing:-.03em;display:block}

  /* The mobile bar and its scrim exist at every width and are shown only below
     900px. Kept out of the media query so the rules that make them *work* live
     next to each other rather than being split across the file. */
  .topbar,.nav-scrim{display:none}
  /* Same lockup, same rule. The 17.03:22 ratio is kept here too — a square box
     would letterbox the mark and reopen the gap this was fixed to close. */
  .topbar-brand{display:flex;align-items:baseline;gap:9px;min-width:0}
  .topbar-mark{display:flex;width:12.4px;height:16px;flex:0 0 12.4px}
  .topbar-mark svg{width:100%;height:100%;display:block}
  .topbar-brand b{font:400 17px/1 var(--display);letter-spacing:-.03em}
  .topbar-page{margin-left:auto;font-size:13px;color:var(--faint);
               white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .topbar-toggle{flex:0 0 auto;width:40px;height:40px;display:grid;place-items:center;
                 border:1px solid var(--line-soft);border-radius:11px;background:transparent;
                 color:var(--dim);cursor:pointer;padding:0;
                 transition:color .16s ease,border-color .16s ease,background .16s ease}
  .topbar-toggle:hover{color:var(--ink);border-color:var(--line)}
  .topbar-toggle svg{width:20px;height:20px}
  .topbar-toggle .ico-close{display:none}
  .topbar-toggle[aria-expanded="true"]{color:var(--ink);background:var(--panel);border-color:var(--line)}
  .topbar-toggle[aria-expanded="true"] .ico-menu{display:none}
  .topbar-toggle[aria-expanded="true"] .ico-close{display:block}
  .nav{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:10px;
       color:var(--dim);cursor:pointer;border:0;background:transparent;width:100%;
       font:inherit;text-align:left;transition:background .16s ease,color .16s ease}
  .nav svg{width:17px;height:17px;flex:0 0 17px;opacity:.8}
  .nav:hover{background:var(--raise);color:var(--ink)}
  .nav[aria-current=page]{background:var(--accent-dim);color:var(--accent)}
  .nav[aria-current=page] svg{opacity:1}
  .nav .count{margin-left:auto;font-size:11.5px;color:var(--faint);
              background:var(--raise);border-radius:var(--r-pill);padding:1px 8px}
  .rail-foot{margin-top:auto;flex:none;padding:14px 10px 0;
             border-top:1px solid var(--line-soft);
             font-size:11.5px;color:var(--faint);line-height:1.5}

  /* Who is answering, and whether they are. The persona's name belongs next to
     its state rather than under the product's: they change independently, and
     the state is the half worth glancing at. */
  .agent{display:flex;align-items:center;gap:9px}
  .agent-who{min-width:0}
  .agent-who b{display:block;font-weight:500;font-size:12.5px;color:var(--dim);
               white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .agent-who small{display:block;font-size:11px;color:var(--faint)}

  /* The way in to the agent, directly under the agent's own name — because the
     pane belongs to Juan, not to a conversation. It used to live in a thread
     header, which put it out of reach whenever no conversation was selected
     and implied a scope it does not have: one pane carries every chat at once.

     Deliberately not the accent fill. Cyan already says two things here — "you
     are on this page" on a nav row, and "Juan said this" in a thread — and the
     one control that types into a stranger's live conversation should borrow
     neither. A bordered rectangle rather than an inset pill, so the shape says
     control rather than destination. */
  .rail-term{display:flex;align-items:center;gap:10px;width:100%;margin-top:13px;
       padding:8px 10px;border:1px solid var(--line);border-radius:9px;
       background:transparent;color:var(--dim);font:inherit;font-size:12.5px;
       cursor:pointer;text-align:left;
       transition:border-color .16s ease,color .16s ease}
  .rail-term svg{width:15px;height:15px;flex:0 0 15px;opacity:.7}
  .rail-term:hover,.rail-term:focus-visible{border-color:var(--accent);color:var(--ink)}
  .rail-term:hover svg,.rail-term:focus-visible svg{opacity:1}
  .rail-term:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  /* The same treatment the nav uses for a count, because it is the same kind of
     fact: how many conversations are open is what you are walking into. */
  .rail-term .count{margin-left:auto;font-size:11.5px;color:var(--faint);
       background:var(--raise);border-radius:var(--r-pill);padding:1px 8px}

  .dot{width:8px;height:8px;flex:0 0 8px;border-radius:50%;
       background:var(--faint);transition:background .2s ease}
  .dot.live{background:var(--accent)}
  .dot.busy{background:var(--warn)}
  .dot.down{background:var(--bad)}
  /* Only the working state moves, and only because "something is happening" is
     the one thing a colour alone cannot say. */
  .dot.busy{animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.35}}
  @media (prefers-reduced-motion:reduce){.dot.busy{animation:none}}

  /* `main` is the scroll container, so the rail simply never moves. */
  main{flex:1;min-width:0;display:flex;flex-direction:column;overflow-y:auto}
  /* flex:none — without it this shrinks as the page grows and clips the heading. */

  .page-wrap{padding:40px 40px 64px;position:relative;flex:1;min-height:0}
  h2{font:400 21px/1.2 var(--display);letter-spacing:-.02em;margin:0 0 4px}
  .sub{font-size:13.5px;color:var(--faint);margin:0 0 20px;max-width:64ch}

  .reveal{opacity:0;transform:translateY(10px);animation:rise .45s cubic-bezier(.2,.7,.3,1) forwards}
  @keyframes rise{to{opacity:1;transform:none}}
  .page{display:none}
  .page.on{display:block}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(126px,1fr));gap:1px;
         background:var(--line-soft);border:1px solid var(--line-soft);
         border-radius:var(--r-card);overflow:hidden;margin-bottom:26px}
  .stat{background:var(--panel);padding:16px 18px}
  .stat b{display:block;font:400 27px/1.1 var(--display);letter-spacing:-.03em}
  .stat small{display:block;margin-top:4px;font-size:12px;color:var(--faint)}
  .stat.accent b{color:var(--accent)}
  .stat.bad b{color:var(--bad)}

  .card{background:var(--panel);border:1px solid var(--line-soft);
        border-radius:var(--r-card);padding:20px 22px;margin-bottom:18px;
        position:relative;isolation:isolate}
  .card::before{content:"";position:absolute;inset:0;border-radius:inherit;
    pointer-events:none;z-index:-1;
    background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%27120%27%20height%3D%27120%27%3E%3Cfilter%20id%3D%27f%27%3E%3CfeTurbulence%20type%3D%27fractalNoise%27%20baseFrequency%3D%272.2%27%20numOctaves%3D%272%27%20stitchTiles%3D%27stitch%27%2F%3E%3CfeColorMatrix%20type%3D%27saturate%27%20values%3D%270%27%2F%3E%3C%2Ffilter%3E%3Crect%20width%3D%27100%25%27%20height%3D%27100%25%27%20filter%3D%27url%28%23f%29%27%2F%3E%3C%2Fsvg%3E");background-size:120px 120px;
    opacity:.03;mix-blend-mode:overlay}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:11.5px;color:var(--faint);font-weight:400;
     padding:0 12px 10px 0;border-bottom:1px solid var(--line-soft)}
  td{padding:12px 12px 12px 0;border-bottom:1px solid var(--line-soft);vertical-align:middle}
  tr:last-child td{border-bottom:0}
  .key{font-family:var(--mono);font-size:12px;color:var(--faint)}
  .muted{color:var(--faint)}

  .line{display:grid;grid-template-columns:56px 92px 1fr;gap:14px;padding:11px 0;
        border-bottom:1px solid var(--line-soft)}
  .line:last-child{border-bottom:0}
  .when{font-size:12.5px;color:var(--faint)}
  .tag{font-size:11.5px;color:var(--faint)}
  .tag.out{color:var(--accent)} .tag.refused{color:var(--warn)} .tag.in{color:var(--ink)}
  .said{white-space:pre-wrap;overflow-wrap:anywhere}
  .why{font-size:12.5px;color:var(--warn);margin-top:3px}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:12px}
  .tile{background:var(--panel);border:1px solid var(--line-soft);border-radius:12px;overflow:hidden}
  .tile{position:relative}
  .tile .tag{position:absolute;top:8px;left:8px;z-index:1;
             font-size:10.5px;letter-spacing:.02em;padding:3px 7px;
             border-radius:var(--r-pill);background:rgba(8,8,10,.72);
             color:var(--faint);border:1px solid var(--line)}
  .tile .tag.sent{color:var(--accent);border-color:var(--accent)}
  .tile img,.tile video{width:100%;height:120px;object-fit:cover;display:block;background:var(--raise)}
  .tile .none{height:120px;display:grid;place-items:center;color:var(--faint);font-size:12px}
  .tile .meta{padding:8px 10px;font-size:11.5px;color:var(--faint)}

  /* ── Voice notes ────────────────────────────────────────────────────────────
     Full-width rows rather than tiles. A recording has no thumbnail, so a
     square in the picture grid is a player floating in empty space — and since
     they are transcribed now, the words are the part worth reading, which a
     148px column cannot carry. */
  .subhead{font:400 13px/1.2 var(--display);letter-spacing:.02em;color:var(--faint);
           text-transform:uppercase;margin:22px 0 10px}
  .subhead:first-child{margin-top:0}
  /* Several per row: a voice note is a line of text with a player behind it,
     not a picture, so it does not need a picture's width. */
  .voicegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
  .voice-open{display:block;width:100%;text-align:left;background:transparent;
              border:0;padding:12px 14px;cursor:pointer;color:inherit;font:inherit}
  .voice-open:hover{background:var(--raise)}
  .voice-open:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .voice-player{padding:0 14px 12px}
  .voice-player audio{width:100%;height:36px;display:block}
  .voice-foot{display:flex;justify-content:flex-end;padding:0 10px 8px}
  /* The card is a frame now; its padding belongs to the parts inside it, which
     are a full-width button and a player that must sit flush under it. */
  .voice{background:var(--panel);border:1px solid var(--line-soft);border-radius:12px;
         overflow:hidden;display:flex;flex-direction:column}
  .voice-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .voice-head .who{font-size:13px;color:var(--ink);min-width:0;overflow-wrap:anywhere}
  .voice-head .tag{font-size:10.5px;letter-spacing:.02em;padding:3px 7px;
                   border-radius:var(--r-pill);color:var(--faint);border:1px solid var(--line)}
  .voice-head .tag.sent{color:var(--accent);border-color:var(--accent)}
  /* Pushed to the far end so the name and the tag stay together on the left. */
  .voice-head .meta{font-size:11.5px;color:var(--faint);margin-left:auto}
  .voice .said{margin:9px 0 0;padding:0 0 0 11px;border-left:2px solid var(--line);
               font-size:13.5px;line-height:1.55;color:var(--dim)}
  .voice .said.none{color:var(--faint);font-style:italic;border-left-style:dotted}

  /* ── Delete ─────────────────────────────────────────────────────────────────
     Quiet until wanted. It removes a message somebody sent, with no trash and
     no copy kept, so it should not sit under the thumb of someone scrolling. */
  .bin{background:transparent;border:1px solid var(--line);color:var(--faint);
       border-radius:8px;width:30px;height:30px;line-height:1;padding:0;cursor:pointer;
       font-size:13px;opacity:.55;transition:opacity .15s,border-color .15s,color .15s}
  .bin:hover,.bin:focus-visible{opacity:1;color:var(--bad);border-color:var(--bad)}
  .tile .bin{position:absolute;top:8px;right:8px;z-index:1;background:rgba(8,8,10,.72)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  button.danger{border-color:var(--bad);color:var(--bad)}
  button.danger:hover:not(:disabled){background:var(--bad);color:var(--ground)}
  button.danger:disabled{opacity:.5;cursor:default}

  @media (hover:none){
    /* No hover to reveal it, so it stays legible on a phone. */
    .bin{opacity:1;min-width:40px;min-height:40px}
  }

  .controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
  button{font:inherit;cursor:pointer;border-radius:var(--r-pill);padding:9px 18px;
         border:1px solid var(--line);background:var(--raise);color:var(--ink);
         transition:background .16s ease,border-color .16s ease,color .16s ease}
  button:hover{border-color:rgba(255,255,255,.2)}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  button.primary{background:var(--accent);border-color:var(--accent);color:#04252b;font-weight:500}
  button.primary:hover{filter:brightness(1.08)}
  button.danger:hover{border-color:var(--bad);color:var(--bad)}
  button.sm{padding:5px 12px;font-size:12.5px}
  button[disabled]{opacity:.42;cursor:not-allowed}

  input[type=text],input[type=search],select{font:inherit;color:var(--ink);
    background:var(--raise);border:1px solid var(--line);border-radius:10px;
    padding:9px 13px;min-width:0}
  input::placeholder{color:var(--faint)}
  input:focus,select:focus{outline:none;border-color:var(--accent)}
  input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .search{flex:1;min-width:180px}

  .seg{display:inline-flex;background:var(--raise);border:1px solid var(--line);
       border-radius:var(--r-pill);padding:3px;gap:2px}
  .seg button{border:0;background:transparent;padding:6px 14px;font-size:13px;color:var(--dim)}
  .seg button[aria-pressed=true]{background:var(--accent-dim);color:var(--accent)}

  .switch{display:inline-flex;align-items:center;gap:11px;cursor:pointer}
  .switch input{position:absolute;opacity:0;width:0;height:0}
  .track{width:42px;height:24px;border-radius:var(--r-pill);background:var(--raise);
         border:1px solid var(--line);position:relative;
         transition:background .18s ease,border-color .18s ease}
  .track::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;
                border-radius:50%;background:var(--dim);
                transition:transform .18s ease,background .18s ease}
  .switch input:checked + .track{background:var(--accent-dim);border-color:var(--accent)}
  .switch input:checked + .track::after{transform:translateX(18px);background:var(--accent)}
  .switch input:disabled + .track{opacity:.5}
  .switch input:focus-visible + .track{outline:2px solid var(--accent);outline-offset:2px}

  .range{-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;
         background:var(--line);width:170px}
  .range::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;
         border-radius:50%;background:var(--accent);cursor:pointer}
  .range:disabled::-webkit-slider-thumb{background:var(--faint)}
  .range::-moz-range-thumb{width:15px;height:15px;border:0;
         border-radius:50%;background:var(--accent);cursor:pointer}
  .range:disabled::-moz-range-thumb{background:var(--faint)}

  /* A slider and a box. The slider makes the range legible; the box is the one
     that can express an exact value, which for the millisecond fields the
     slider cannot — an hour of range across 170 pixels. */
  /* A grid rather than a flex row, so every slider on a card is exactly the
     same length and they line up down the column. A flex row let each control
     size itself, which made ten sliders ten different lengths. */
  .numeric{display:grid;grid-template-columns:1fr 9ch 4.5ch;
           align-items:center;gap:10px;width:290px}
  .numeric .range{width:100%}
  .numeric .unit{text-align:left}
  .numeric .badge{grid-column:1/-1;justify-self:start;margin-top:2px}
  .textset{font:inherit;font-family:var(--mono);font-size:12.5px;color:var(--ink);
           background:var(--raise);border:1px solid var(--line);border-radius:8px;
           padding:7px 10px;width:280px;max-width:100%}
  .numbox{font:inherit;font-family:var(--mono);font-size:12.5px;color:var(--ink);
          background:var(--raise);border:1px solid var(--line);border-radius:8px;
          padding:6px 8px;width:9ch;text-align:right}

  .field{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;
         padding:13px 0;border-bottom:1px solid var(--line-soft)}
  /* A <label> when it names a checkbox, so the words are a hit target too. */
  /* ── The persona reader ─────────────────────────────────────────────────────
     A brief is prose, and prose has different needs from a settings page: a
     measure you can read a paragraph in, headings with room around them, and a
     way in that is not the scroll bar. Contents on the left, one document at a
     time, chosen with the same segmented control the rest of the panel uses. */
  .personabody{display:grid;grid-template-columns:220px minmax(0,1fr);gap:36px;margin-top:22px}
  .doctoc{position:sticky;top:28px;align-self:start;display:flex;flex-direction:column;gap:1px;
          border-left:1px solid var(--line-soft);padding-left:2px;max-height:calc(100dvh - 90px);overflow-y:auto}
  .doctoc a{font-size:12.5px;line-height:1.4;color:var(--faint);text-decoration:none;
            padding:6px 10px;border-left:2px solid transparent;margin-left:-2px}
  .doctoc a:hover{color:var(--ink);border-left-color:var(--accent)}
  .doctoc a:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

  .doccol{min-width:0}
  .docmeta{font-family:var(--mono);font-size:11.5px;color:var(--faint);margin:0 0 20px;
           text-transform:none;letter-spacing:.02em}
  /* 66ch: long enough for an argument, short enough to find the next line. */
  .doc{max-width:66ch}
  .doc h3{font:400 21px/1.25 var(--display);letter-spacing:-.02em;margin:40px 0 10px;color:var(--ink);
          scroll-margin-top:26px}
  .doc h3:first-child{margin-top:0}
  .doc h4{font:500 14.5px/1.35 var(--body);margin:22px 0 6px;color:var(--ink)}
  .doc h5{font:500 13px/1.35 var(--body);margin:16px 0 4px;color:var(--dim)}
  .doc p{font-size:14px;line-height:1.68;color:var(--dim);margin:0 0 13px}
  .doc strong{color:var(--ink);font-weight:500}
  .doc ul{margin:0 0 13px;padding-left:20px}
  .doc li{font-size:14px;line-height:1.6;color:var(--dim);margin:5px 0}
  .doc blockquote{margin:14px 0;padding-left:14px;border-left:2px solid var(--accent-dim);
                  font-size:14px;line-height:1.65;color:var(--dim)}
  .doc code{font-family:var(--mono);font-size:12.5px;color:var(--accent);
            background:var(--accent-dim);border:0;border-radius:5px;padding:1px 5px}
  .doc pre{font-family:var(--mono);font-size:12px;line-height:1.55;color:var(--faint);
           background:var(--raise);border:1px solid var(--line-soft);border-radius:8px;
           padding:11px 13px;margin:10px 0 14px;white-space:pre-wrap;overflow-x:auto}
  .doc pre code{background:none;color:inherit;padding:0}
  .doc hr{border:0;border-top:1px solid var(--line-soft);margin:32px 0}

  @media (max-width:900px){
    .personabody{grid-template-columns:1fr;gap:18px}
    /* Contents first and scrollable sideways: a 30-item column above the text
       would push the document itself off the screen entirely. */
    .doctoc{position:static;flex-direction:row;overflow-x:auto;border-left:0;
            border-bottom:1px solid var(--line-soft);padding:0 0 8px;max-height:none}
    .doctoc a{white-space:nowrap;border-left:0;border-bottom:2px solid transparent;margin:0}
    .doctoc a:hover{border-left-color:transparent;border-bottom-color:var(--accent)}
  }

  .field-name{display:block}
  label.field-name{cursor:pointer}
  .field:last-child{border-bottom:0}
  .field .hint{font-size:12.5px;line-height:1.5;color:var(--faint);margin-top:3px;max-width:62ch}

  /* The vocabulary card. A definition list, because that is what it is: the
     three words the rest of the page is written in. */
  .primer .define{display:grid;grid-template-columns:14ch 1fr;gap:14px;
                  padding:11px 0;border-bottom:1px solid var(--line-soft)}
  .primer .define:last-child{border-bottom:0;padding-bottom:0}
  .primer dt{color:var(--ink);font-weight:500}
  .primer dd{margin:0;font-size:12.5px;line-height:1.55;color:var(--faint);max-width:62ch}
  @media (max-width:900px){
    .primer .define{grid-template-columns:1fr;gap:4px}
  }
  .value{font-family:var(--mono);font-size:12.5px;color:var(--dim)}

  .badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;
         border:1px solid var(--line);border-radius:var(--r-pill);padding:3px 10px;color:var(--dim)}
  .badge.on{border-color:var(--accent);color:var(--accent)}
  .badge.off{border-color:var(--warn);color:var(--warn)}

  /* ── Chat ───────────────────────────────────────────────────────────────────
     The masked chat: one conversation, read the way a conversation is read.

     This is the panel's primary surface and it is a chat client — a list of
     conversations beside a thread that scrolls on its own, with the box to type
     in pinned under it. It was a card containing a log with a text area stapled
     below, and that shape was the problem: it read as a page *about* a
     conversation rather than as the conversation.

     Two structural rules carry the whole thing, and both are about masking.

     **Only speech gets a bubble.** What a person sent, what Juan sent them, and
     what an operator typed at his prompt. Everything else Juan did between
     those — the tools, the thinking, the words he wrote in session that nobody
     received — is a band that spans the column. Alignment is the encoding: a
     bubble hangs from one edge and is somebody talking; a band touches both
     edges and is a stage direction.

     **The accent is Juan's voice and nothing else.** Cyan appears in the thread
     on his bubbles and nowhere else, so "who said this" is answered before
     anything is read. Amber is the operator's own line, and it is unfilled,
     because it is not speech to the person on WhatsApp — it is a line typed
     into Juan's prompt that he may or may not act on.

     Everything reaching the DOM here arrives as `textContent`. Half of it was
     written by a stranger and the other half by an agent that reads what
     strangers write. */

  /* The page gives up the document's padding and takes the frame. Two panes
     that scroll independently cannot live inside one page that scrolls as a
     whole; `.bare` does the same for the terminal, for the same reason. */
  .page-wrap.chatmode{padding:0;flex:1;min-height:0;display:flex}
  .page-wrap.chatmode > .page.on{flex:1;min-width:0;min-height:0;display:flex;
                                 animation:none;opacity:1;transform:none}

  .chatapp{flex:1;min-width:0;min-height:0;display:grid;
           grid-template-columns:284px minmax(0,1fr)}

  /* ── The conversation list ──────────────────────────────────────────────────
     A picker was a <select>, which is the control you reach for when the list
     is an argument rather than the thing itself. Here it is the thing itself:
     who has written, what they last said, and how long ago. */
  .convo{min-width:0;min-height:0;display:flex;flex-direction:column;
         background:var(--panel);border-right:1px solid var(--line-soft)}
  .convo-head{flex:none;padding:14px 14px 12px;border-bottom:1px solid var(--line-soft)}
  .convo-head input{width:100%}
  .convo-list{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
  /* A 2px bar rather than a fill, so the selected row reads at the edge of
     vision without the list becoming a column of coloured blocks. */
  .convo-row{display:grid;grid-template-columns:9px minmax(0,1fr) auto;
             gap:2px 9px;align-items:baseline;width:100%;text-align:left;
             font:inherit;color:inherit;cursor:pointer;
             background:transparent;border:0;border-left:2px solid transparent;
             border-bottom:1px solid var(--line-soft);padding:11px 14px 12px 12px;
             transition:background .14s ease}
  .convo-row:hover{background:var(--raise)}
  .convo-row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .convo-row .dot{width:6px;height:6px;flex:0 0 6px;align-self:center;
                  background:transparent;transition:background .2s ease}
  .convo-row .name{min-width:0;font-size:13.5px;color:var(--ink);
                   white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .convo-row .when{font-size:11px;color:var(--faint);white-space:nowrap}
  .convo-row .last{grid-column:2/-1;font-size:12.5px;line-height:1.45;color:var(--faint);
                   white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .convo-row[aria-current="true"]{background:var(--accent-dim);border-left-color:var(--accent)}
  .convo-row[aria-current="true"] .name{color:var(--accent)}
  .convo-row[aria-current="true"]:hover{background:var(--accent-dim)}
  .convo-none{padding:22px 16px;font-size:12.5px;line-height:1.6;color:var(--faint)}

  /* ── The thread ─────────────────────────────────────────────────────────────
     One column, and one gutter down each side of it. The header's text, every
     bubble's outer edge, both ends of every band and the composer's field all
     start and stop on the same two lines, so nothing in the pane wanders off
     them.

     The column is capped rather than filling the pane, and that is not a taste
     decision: with speech hanging from both edges of a 1100px pane, an incoming
     message and the reply to it sit half a metre apart with a void between, and
     the eye stops reading them as one conversation. `--col` is what closes that
     gap; the header and the composer are inset by the same rule so the three
     cannot drift.

     The chrome stays full width — the header's rule and the composer's ground
     belong to the pane. Only their contents are capped, which is what the
     inner `.cap` is for. */
  .thread-pane{--gut:26px;--col:min(880px,100%);
               min-width:0;min-height:0;display:flex;flex-direction:column}
  .cap{width:100%;max-width:var(--col);margin-inline:auto;padding-inline:var(--gut)}
  .thread-head{flex:none;border-bottom:1px solid var(--line-soft)}
  .thread-head .cap{display:flex;align-items:center;gap:14px;padding-block:15px 14px}
  .thread-head .who{min-width:0;flex:1}
  .thread-head h3{font:400 17px/1.2 var(--display);letter-spacing:-.02em;margin:0;
                  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .thread-head .sub{display:flex;align-items:center;gap:8px;margin:4px 0 0;
                    font-size:11.5px;color:var(--faint);max-width:none;flex-wrap:wrap}
  .thread-head .sub .key{font-size:11px}
  .thread-head .acts{flex:0 0 auto;display:flex;gap:8px;align-items:center}
  /* The raw pty, demoted. It is still one click away and it is deliberately not
     the first thing on the page: it shows other people's keys, tool arguments
     and whatever a stack trace printed. */
  .raw{display:inline-flex;align-items:center;gap:7px}
  .raw svg{width:15px;height:15px;opacity:.75}

  /* Hidden until the list and the thread share a column. `.nav svg` sizes the
     rail's icons and does not reach here, so without this the chevron takes an
     SVG's default 300x150 and the button renders empty. */
  .backrow{display:none;flex:0 0 auto}
  .backrow svg{width:16px;height:16px}

  .thread-wrap{position:relative;flex:1;min-width:0;min-height:0;display:flex}
  .thread{flex:1;min-height:0;width:100%;max-width:var(--col);margin-inline:auto;
          overflow-y:auto;overscroll-behavior:contain;
          display:flex;flex-direction:column;gap:10px;
          padding:20px var(--gut) 24px}

  /* ── Speech ─────────────────────────────────────────────────────────────────
     One asymmetric corner on the side the bubble hangs from. It is the whole of
     the "tail" and it is enough: a drawn tail is a decoration, a clipped corner
     is the same information in the shape already there. */
  .msg{max-width:min(62ch,84%);border-radius:14px;padding:9px 13px 7px;
       border:1px solid var(--line-soft);background:var(--raise)}
  .msg .body{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13.5px;line-height:1.55}
  .msg .at{display:block;margin-top:3px;text-align:right;font-size:10.5px;color:var(--faint)}
  .msg.them{align-self:flex-start;border-bottom-left-radius:5px}
  .msg.juan{align-self:flex-end;border-bottom-right-radius:5px;
            background:var(--accent-dim);border-color:rgba(33,210,237,.3)}
  /* Unfilled and amber: a line an operator typed at Juan's prompt. Nobody on
     WhatsApp received it, and whether they ever hear anything about it is
     Juan's decision rather than this panel's. */
  .msg.op{align-self:flex-end;border-bottom-right-radius:5px;
          background:transparent;border-color:rgba(240,180,41,.45)}
  .msg.op .at{color:var(--warn)}
  /* The name above a run, not on every bubble. Repeating it on each one is what
     makes a thread read as a table of rows rather than as somebody talking. */
  .said-by{align-self:flex-start;margin:6px 0 -5px;padding:0 2px;
           font-size:11px;color:var(--faint)}
  .said-by.mine{align-self:flex-end}
  .said-by.op{color:var(--warn)}
  /* Consecutive lines from the same side, close together in time. */
  .msg.run{margin-top:-6px}

  .daymark{align-self:center;margin:8px 0 2px;font-size:11px;color:var(--faint);
           background:var(--raise);border:1px solid var(--line-soft);
           border-radius:var(--r-pill);padding:3px 12px}

  /* ── The work band ──────────────────────────────────────────────────────────
     What Juan did between two messages, which is the interesting half and was
     the unreadable half: a column of mono chips carrying file paths, URLs and
     other people's chat keys.

     Collapsed it is one sentence of narration and a step count. Opened it is a
     list of verbs in a fixed column with a masked detail beside each — a
     basename rather than a path, a hostname rather than a URL, a program name
     rather than a command line. Nothing in it is a raw argument, and the two
     steps that are pure machinery (the typing indicator, the agent asking which
     chat it is in) are not listed at all. */
  .work{align-self:stretch;margin:3px 0;border:1px solid var(--line-soft);
        border-left:2px solid rgba(255,255,255,.26);border-radius:0 11px 11px 0;
        background:rgba(255,255,255,.022)}
  /* Amber, and only while it is happening: the same yellow the rail's dot uses
     for a turn in flight, so one colour means one thing across the panel. */
  .work.busy{border-left-color:var(--warn);background:rgba(240,180,41,.05)}
  .work-open{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
             font:inherit;font-size:12.5px;color:var(--dim);
             background:transparent;border:0;border-radius:0 11px 11px 0;
             padding:9px 13px;cursor:pointer}
  .work-open:hover{color:var(--ink)}
  .work-open:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .work-open .caret{flex:0 0 auto;width:9px;color:var(--faint);
                    transition:transform .16s ease;transform-origin:45% 50%}
  .work-open[aria-expanded="true"] .caret{transform:rotate(90deg)}
  .work-open .what{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .work.busy .work-open .what{color:var(--warn)}
  .work-open .n{flex:0 0 auto;font-size:11px;color:var(--faint)}
  /* Indented to the summary's own text, past the caret: the steps are what the
     summary opened, so they begin where it begins. */
  .work-steps{padding:0 13px 10px 32px}
  .work-steps[hidden]{display:none}
  /* A fixed first column, so every detail on the list starts on one line
     however long the verbs are. 19ch is the longest verb in `WA` and `TOOLS`
     plus a hair — keep it that way, or a two-line verb beside a one-line
     detail puts the row out of true. */
  .step{display:grid;grid-template-columns:19ch minmax(0,1fr);gap:14px;
        padding:6px 0;border-top:1px solid var(--line-soft);font-size:12.5px}
  .step .verb{color:var(--dim)}
  .step .detail{min-width:0;font-family:var(--mono);font-size:11.5px;color:var(--faint);
                overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* Prose, so it gets the width and the wrapping that a one-line detail does
     not: Juan's own words in session, and his thinking. */
  .step.prose{grid-template-columns:19ch minmax(0,1fr)}
  .step.prose .detail{font-family:var(--body);font-size:12.5px;line-height:1.55;
                      white-space:pre-wrap;overflow-wrap:anywhere;color:var(--dim)}
  .step .more{display:block;margin-top:4px;padding:0;font:inherit;font-size:11.5px;
              color:var(--faint);background:transparent;border:0;cursor:pointer;text-align:left}
  .step .more:hover{color:var(--dim)}
  .step .more:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .step .thinking{margin-top:5px;padding-left:11px;border-left:2px dotted var(--line);
                  font-family:var(--body);font-size:12.5px;line-height:1.55;color:var(--faint);
                  white-space:pre-wrap;overflow-wrap:anywhere}

  /* Three dots in Juan's own bubble, because a turn is running for this
     conversation. `queue.inFlight` is a chat key, so this can only ever appear
     on the conversation actually being answered. */
  .typing{align-self:flex-end;display:flex;gap:5px;align-items:center;
          padding:12px 15px;border-radius:14px;border-bottom-right-radius:5px;
          background:var(--accent-dim);border:1px solid rgba(33,210,237,.3)}
  .typing i{width:5px;height:5px;border-radius:50%;background:var(--accent);opacity:.38;
            animation:bob 1.25s ease-in-out infinite}
  .typing i:nth-child(2){animation-delay:.16s}
  .typing i:nth-child(3){animation-delay:.32s}
  @keyframes bob{30%{opacity:1;transform:translateY(-3px)}}
  /* With motion off the dots stop rather than disappear, so the state is still
     on the screen — and the element carries the words for a screen reader. */
  @media (prefers-reduced-motion:reduce){.typing i{opacity:.9}}

  /* Only while the reader is somewhere other than the bottom. Following a
     conversation and reading the middle of one are different jobs, and the
     scroll must not be taken away from the second to serve the first. */
  .jump{position:absolute;left:50%;bottom:16px;z-index:2;transform:translateX(-50%);
        padding:6px 15px;font-size:12.5px;border-radius:var(--r-pill);
        background:var(--raise);border:1px solid var(--line);color:var(--ink);
        box-shadow:0 8px 24px rgba(0,0,0,.45);cursor:pointer}
  .jump:hover{border-color:var(--accent);color:var(--accent)}

  /* ── Empty and failed ───────────────────────────────────────────────────────
     Neither is an error. No session open is the ordinary resting state of every
     conversation on this panel, so it is written as direction. */
  .pane-empty{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;
              align-items:center;justify-content:center;text-align:center;padding:40px 32px}
  .pane-empty svg{width:26px;height:26px;color:var(--faint);opacity:.6;margin-bottom:2px}
  .pane-empty h3{font:400 19px/1.25 var(--display);letter-spacing:-.02em;margin:0;color:var(--dim)}
  .pane-empty p{margin:0;max-width:46ch;font-size:13px;line-height:1.65;color:var(--faint)}
  .thread-note{align-self:center;max-width:46ch;margin:auto 0;padding:18px 4px;
               text-align:center;font-size:13px;line-height:1.65;color:var(--faint)}
  .thread-note b{display:block;margin-bottom:5px;font-weight:400;color:var(--dim);
                 font-family:var(--display);font-size:15px;letter-spacing:-.01em}
  .thread-note button{margin-top:12px}

  /* ── The composer ───────────────────────────────────────────────────────────
     Pinned under the thread, and the reason it is disabled is written against
     it rather than in a banner at the top of the page. A banner is read once
     and becomes furniture; what has to be true is that the person is named at
     the moment of pressing the button — so the line above the field carries the
     name, and the confirm quotes the exact text that will be typed. */
  .composer{flex:none;padding:0;background:var(--panel);
            border-top:1px solid var(--line-soft)}
  .composer .cap{padding-block:12px 14px}
  .composer .why{display:flex;align-items:flex-start;gap:9px;margin:0 0 9px;
                 font-size:12.5px;line-height:1.5;color:var(--faint)}
  .composer .why .dot{margin-top:5px;background:var(--faint)}
  .composer .why.live{color:var(--dim)}
  .composer .why.live .dot{background:var(--accent)}
  .composer .why.warn{color:var(--warn)}
  .composer .why.warn .dot{background:var(--warn)}
  .composer .why.bad{color:var(--bad)}
  .composer .why.bad .dot{background:var(--bad)}
  /* flex-end, so the button stays on the field's bottom edge as the box grows
     rather than drifting up the middle of it. */
  .composer .row{display:flex;align-items:flex-end;gap:10px}
  .composer textarea{flex:1;min-width:0;display:block;resize:none;overflow-y:auto;
    height:42px;min-height:42px;max-height:168px;
    font:inherit;font-size:13.5px;line-height:1.5;color:var(--ink);
    background:var(--raise);border:1px solid var(--line);border-radius:12px;padding:10px 13px}
  .composer textarea::placeholder{color:var(--faint)}
  .composer textarea:focus{outline:none;border-color:var(--accent)}
  .composer textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .composer textarea:disabled{opacity:.5;cursor:not-allowed}
  .composer .row button{flex:0 0 auto;height:42px;padding:0 18px}
  .composer .count{display:block;margin-top:6px;text-align:right;
                   font-size:11px;color:var(--faint)}
  /* It is empty for all but the last three hundred characters, and an empty
     block still spends its own top margin on the composer's height. */
  .composer .count:empty{display:none}
  .composer .count.near{color:var(--warn)}

  @media (max-width:900px){
    /* Below this width the document scrolls as a whole — `body` takes the
       scroll and `main` goes visible. A chat client cannot live in that: its
       two panes scroll on their own and its composer sits on the bottom edge of
       the window, both of which need a fixed height to sit inside. So on this
       page, and only on this page, the frame comes back. */
    body.chatmode{overflow:hidden}
    body.chatmode main{flex:1;min-height:0;overflow:hidden}

    /* One pane at a time. The list is the page until a conversation is chosen,
       and the thread is the page after that — with the way back in the header,
       where the conversation's name already is. */
    .chatapp{grid-template-columns:minmax(0,1fr)}
    .convo{border-right:0}
    .chatapp.reading .convo{display:none}
    .chatapp:not(.reading) .thread-pane{display:none}
    .backrow{display:flex}
    .thread-pane{--gut:16px;--col:100%}
    .msg{max-width:92%}
    .step,.step.prose{grid-template-columns:minmax(0,1fr);gap:2px}
    .thread-head .acts .raw span{display:none}
    .thread-head .acts .raw{padding:0;width:44px;height:44px;justify-content:center}
  }

  /* The pill has two meanings and one of them is news. Parked because you
     scrolled up to reread is navigation; parked while it kept talking is
     something you have not seen — and only that one gets the amber. */
  .jump.new{border-color:var(--warn);color:var(--warn)}
  .jump.new:hover{border-color:var(--warn);color:var(--warn);filter:brightness(1.12)}
  /* Typed, and not yet read back out of the transcript. The poll is seconds
     away, and a send that produces nothing on the screen reads as a send that
     did not happen. */
  .msg.pending{opacity:.6}

  /* ── Terminal ───────────────────────────────────────────────────────────────
     The page *is* the terminal. The heading, the warning bar, the readable/raw
     toggle, the window picker and the three key buttons are all gone: what an
     operator wants here is the session, not a console built around it.

     The emulator is pinned at the pane's own 200x50 and the font size is
     computed to fit, rather than the grid being reflowed to the window. That is
     not a cosmetic choice — the supervisor reads this pane to decide whether a
     turn is running, and `agent/src/tmux.ts` pins `window-size manual` exactly
     so that a browser cannot resize it out from under that parser. */
  /* ── The terminal ───────────────────────────────────────────────────────────
     Full-bleed and over everything: a terminal wants the whole window, and the
     panel's chrome around it was competing with tmux's own status line. */
  /* The launcher card these two dressed went with the Terminal page. What opens
     the stage now is the Chat page's own secondary control, which is a
     `button.sm` like every other one on the panel. */
  /* A modal the terminal sits inside, not a full-screen takeover.
     The scrim keeps the panel visibly *on top of* the console rather than
     replacing it, which is the difference between "I opened a tool" and "the
     page navigated somewhere" — and the second one is why the old full-bleed
     version left people looking for a way back. */
  .termstage{position:fixed;inset:0;z-index:60;display:flex;align-items:center;
        justify-content:center;padding:clamp(12px,3vh,40px);
        background:rgba(6,7,9,.72);backdrop-filter:blur(8px)}
  /* Sized to the viewport with a ceiling, so the terminal fits whatever it is
     given: min-height:0 on the frame is what lets it shrink inside the flex
     column rather than overflowing the panel it is supposed to be inside. */
  .termmodal{display:flex;flex-direction:column;overflow:hidden;
        width:min(1180px,96vw);height:min(720px,88vh);
        background:#0d0d0f;border:1px solid var(--line);border-radius:14px;
        box-shadow:0 24px 80px rgba(0,0,0,.6)}
  .termbar{display:flex;align-items:center;gap:12px;flex:none;
        padding:10px 10px 10px 16px;border-bottom:1px solid var(--line);
        background:rgba(255,255,255,.02)}
  .termbar h2{margin:0;font-size:13px;font-weight:600;letter-spacing:.01em}
  .termbar .termwhere{font-size:12px;color:var(--dim);margin-right:auto}
  .ptyframe{flex:1;min-height:0;width:100%;border:0;display:block;background:#0d0d0f}
  /* In the bar rather than floating over the canvas. Every one is a workaround
     for something a canvas cannot do — select, copy, paste, scroll. */
  .termcontrols{display:flex;gap:6px;flex:none}
  .termcontrols button{width:30px;height:30px;border-radius:8px;
        display:flex;align-items:center;justify-content:center;font-size:13px;
        background:transparent;border:1px solid var(--line);color:var(--dim);cursor:pointer}
  .termcontrols button:hover{color:var(--ink);border-color:var(--accent)}
  .termcontrols button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .termcontrols .termclose{margin-left:6px}
  .termcontrols .termclose:hover{border-color:var(--warn,#f0b429);color:var(--ink)}
  @media (max-width:700px){
    .termstage{padding:0}
    .termmodal{width:100%;height:100%;border-radius:0;border:0}
  }
  /* Nothing behind the terminal should scroll while it is open. */
  body.term-open{overflow:hidden}
  @media (max-width:900px){
    .termcontrols{top:auto;bottom:14px;right:14px}
    .termcontrols button{width:46px;height:46px;font-size:17px}
  }
  .page-wrap.bare{padding:0;flex:1;min-height:0;display:flex}
  .page-wrap.bare .page.on{flex:1;min-height:0;display:flex;flex-direction:column;
                           animation:none;opacity:1;transform:none}
  .page-wrap.bare .warnbar{flex:none;margin:0;border-radius:0}
  .termhost{flex:1;min-width:0;min-height:0;background:#000;overflow:auto;padding:8px 10px}
  .termhost .xterm{height:100%}
  .termnote{margin:auto;color:var(--faint);font-family:var(--mono);font-size:13px;
            text-align:center;padding:24px;line-height:1.7;white-space:pre-line}
  .termnote[hidden],.termhost[hidden]{display:none}
  .warnbar{border:1px solid var(--warn);color:var(--warn);border-radius:10px;
           padding:11px 14px;font-size:13px;margin-bottom:16px}
  .logline{font-family:var(--mono);font-size:12px;padding:5px 0;
           border-bottom:1px solid var(--line-soft);white-space:pre-wrap;overflow-wrap:anywhere}
  .logline b{color:var(--faint);font-weight:400}
  .toolrow{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;
           padding:16px 0;border-bottom:1px solid var(--line-soft)}
  .toolrow:last-child{border-bottom:0}
  .empty{color:var(--faint);padding:20px 0}
  /* ── Modal ─────────────────────────────────────────────────────────────── */
  .scrim{position:fixed;inset:0;z-index:20;display:none;
         background:rgba(6,6,8,.66);backdrop-filter:blur(6px);
         -webkit-backdrop-filter:blur(6px);
         align-items:center;justify-content:center;padding:24px}
  .scrim.on{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-card);
         width:min(520px,100%);max-height:82vh;display:flex;flex-direction:column;
         box-shadow:0 24px 70px rgba(0,0,0,.5);animation:pop .2s cubic-bezier(.2,.7,.3,1)}
  @keyframes pop{from{opacity:0;transform:translateY(8px) scale(.99)}to{opacity:1;transform:none}}
  .modal-head{display:flex;align-items:flex-start;gap:14px;padding:20px 22px 14px;
              border-bottom:1px solid var(--line-soft)}
  .modal-head h3{font:400 19px/1.2 var(--display);letter-spacing:-.02em;margin:0}
  .modal-head p{font-size:12.5px;color:var(--faint);margin:5px 0 0;max-width:44ch}
  .modal-head button{margin-left:auto;padding:5px 12px;font-size:12.5px}
  .modal-body{padding:16px 22px;overflow-y:auto}
  .modal-foot{padding:14px 22px;border-top:1px solid var(--line-soft);
              display:flex;gap:10px;align-items:center}
  .modal-foot .hint{margin:0}
  /* The exact line a confirm is about to act on. Quoted, so it reads as the
     thing being sent rather than as more of the dialog's prose. */
  .modal-body blockquote.said{margin:14px 0 0;padding:10px 13px;
    border-left:2px solid var(--accent);background:var(--raise);
    border-radius:0 10px 10px 0;font-size:13.5px;line-height:1.55}
  .entry{display:flex;gap:10px;align-items:center;padding:9px 0;
         border-bottom:1px solid var(--line-soft)}
  .entry:last-child{border-bottom:0}
  .entry .value{flex:1}
  .adder{display:flex;gap:10px;margin-top:14px}
  .adder input{flex:1}
  .summary{display:flex;align-items:center;gap:12px}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
         background:var(--raise);border:1px solid var(--line);border-radius:var(--r-pill);
         padding:10px 20px;font-size:13.5px;opacity:0;transition:opacity .2s ease;
         pointer-events:none;z-index:9}
  .toast.on{opacity:1}

  /* ── Mobile ────────────────────────────────────────────────────────────────
     The rail stops being a column and becomes a disclosure. What is always on
     screen is the bar: the mark, the page you are on, and the control. The
     eight pages are one tap away and all visible at once when they are — a
     horizontal scroller showed four and gave no sign the rest existed.

     `--bar` is shared by the bar's height and the panel's offset, so the two
     cannot drift apart. */
  @media (max-width:900px){
    :root{--bar:58px}
    body{flex-direction:column;overflow:auto}
    main{overflow:visible}

    /* flex:none because `body` is a flex
       column here, so without it the bar is squeezed whenever `main` overflows
       — measured at 41px on short pages and 58px on tall ones. `--bar` is a
       constant, and it positions both the dropdown and its scrim, so the two
       drifted apart by 17px: a seam that leaked page content and swallowed the
       tap meant to close the menu. */
    .topbar{display:flex;align-items:center;gap:10px;flex:none;
            position:sticky;top:0;z-index:30;height:var(--bar);
            padding:0 16px;background:var(--panel);
            border-bottom:1px solid var(--line-soft)}

    /* Fixed, not in flow: the bar is sticky, so a panel that opened in normal
       flow would appear at the top of the document and be off screen the moment
       anyone had scrolled. */
    .rail{position:fixed;left:0;right:0;top:var(--bar);z-index:29;
          width:auto;flex:none;height:auto;max-height:calc(100dvh - var(--bar));
          overflow-y:auto;padding:10px 12px 16px;gap:2px;
          border-right:0;border-bottom:1px solid var(--line-soft);
          transform:translateY(-8px);opacity:0;visibility:hidden;
          transition:opacity .18s ease,transform .18s ease,visibility 0s linear .18s}
    .rail.open{transform:none;opacity:1;visibility:visible;transition-delay:0s}

    /* In landscape the panel is 332px tall against 468px of content, and a
       scroller with no edge is the exact failure the disclosure replaced — the
       old horizontal strip "gave no sign the rest existed". These two shadows
       are painted only while there is something past the edge: the `local`
       layers scroll away with the content and uncover the `scroll` ones. */
    .rail{background-image:
            linear-gradient(var(--panel) 40%, rgba(0,0,0,0)),
            linear-gradient(rgba(0,0,0,0), var(--panel) 60%),
            radial-gradient(farthest-side at 50% 0, rgba(0,0,0,.35), rgba(0,0,0,0)),
            radial-gradient(farthest-side at 50% 100%, rgba(0,0,0,.35), rgba(0,0,0,0));
          background-position:0 0, 0 100%, 0 0, 0 100%;
          background-repeat:no-repeat;
          background-size:100% 26px, 100% 26px, 100% 10px, 100% 10px;
          background-attachment:local, local, scroll, scroll}

    .nav-scrim{display:block;position:fixed;inset:var(--bar) 0 0;z-index:28;
               background:rgba(8,8,10,.55);opacity:0;transition:opacity .18s ease}
    .nav-scrim.open{opacity:1}

    /* With the menu open the page behind it must not move: a swipe that starts
       on the scrim was scrolling the document rather than the menu. */
    body.nav-open{overflow:hidden}

    /* The rail is an overlay here rather than a column, so the grain starts at
       the window's edge and below the bar instead of beside a 236px gutter. */
    #paper{left:0;top:var(--bar)}

    /* Settings rows: a 170px slider, a box and a readout beside a 58ch hint do
       not fit in 360px. Stack them and let the controls have the width. */
    .field{grid-template-columns:1fr;gap:10px}
    .field > :last-child{justify-self:start}
    .numeric{width:100%}
    .textset{width:100%}
    .adder{flex-wrap:wrap}
    .adder input{flex:1 1 100%}

    /* Touch targets. The visual size of each control is unchanged; what grows
       is the area that answers a finger. 44px is the floor. */
    button.sm{min-height:44px;padding:5px 14px}
    .seg button{min-height:40px}
    .topbar-toggle{width:44px;height:44px}
    .switch{min-height:44px}
    .brand{display:none}
    /* Restored on mobile. It carries who is answering and whether they are,
       which is the one thing worth seeing on the device you check it from. */
    .rail-foot{display:block;margin-top:10px}
    .nav{width:100%;min-height:46px;padding:11px 12px;white-space:nowrap}
    .nav .count{display:inline-block}

    .page-wrap{padding:20px 20px 48px}
    .line{grid-template-columns:52px 1fr;gap:10px}
    .line .tag{display:none}
  }

  @media (prefers-reduced-motion:reduce){
    .rail,.nav-scrim{transition:none}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>

  <!-- Mobile only. The rail is a 236px column on a desktop and cannot be one on
       a phone; the previous answer turned it into a horizontal scroller of eight
       items, which hid both the brand and the fact that pages existed past the
       right edge. This bar is what stays on screen: who you are looking at,
       where you are, and one control to reach everywhere else. -->
  <header class="topbar">
    <div class="topbar-brand">
      <span class="topbar-mark" id="topbarMark"></span>
      <b>Tulip</b>
    </div>
    <span class="topbar-page" id="topbarPage">Overview</span>
    <button class="topbar-toggle" id="navToggle" type="button"
            aria-expanded="false" aria-controls="rail" aria-label="Show pages">
      <svg class="ico-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
        <path d="M4 7h16M4 12h16M4 17h16"/>
      </svg>
      <svg class="ico-close" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
        <path d="M6 6l12 12M18 6L6 18"/>
      </svg>
    </button>
  </header>
  <div class="nav-scrim" id="navScrim" hidden></div>

  <aside class="rail" id="rail">
    <div class="brand">
      <svg viewBox="7.49 4.6 17.03 22" aria-hidden="true">
        <path d="M16 26.6C11.4 24.6 8.2 20.4 7.6 15.2 7.3 12.6 7.6 10.2 8.4 8.4c2 1.2 3.6 3.2 4.7 5.8C13 10.6 14 7.4 16 4.6c2 2.8 3 6 2.9 9.6 1.1-2.6 2.7-4.6 4.7-5.8.8 1.8 1.1 4.2.8 6.8-.6 5.2-3.8 9.4-8.4 11.4z" fill="#21d2ed" opacity=".58"/>
        <path d="M16 4.6c2 2.8 3 6 2.9 9.6 0 5-1.1 9.2-2.9 12.4-1.8-3.2-2.9-7.4-2.9-12.4C13 10.6 14 7.4 16 4.6z" fill="#21d2ed"/>
      </svg>
      <b>Tulip</b>
    </div>
    <nav id="nav"></nav>
    <div class="rail-foot">
      <div class="agent">
        <span class="dot" id="agentDot"></span>
        <span class="agent-who">
          <b id="whoami">connecting</b>
          <small id="agentState">checking</small>
        </span>
      </div>
      <button class="rail-term" id="railTerm" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="4.5" width="18" height="15" rx="2"/>
          <path d="M7.5 9.5l3 2.5-3 2.5"/><path d="M12.5 15h4"/>
        </svg>
        <span>Terminal</span>
        <span class="count" id="railTermCount" hidden></span>
      </button>
    </div>
  </aside>

  <main>
    <div class="page-wrap">
      <div id="paper" aria-hidden="true">
        <div id="paper-flow"></div>
        <div id="paper-grain"></div>
      </div>
      <section class="page" id="p-overview"></section>
      <section class="page" id="p-messages"></section>
      <section class="page" id="p-chats"></section>
      <section class="page" id="p-chat"></section>
      <section class="page" id="p-media"></section>
      <section class="page" id="p-persona"></section>
      <section class="page" id="p-memory"></section>
      <section class="page" id="p-pages"></section>
      <section class="page" id="p-settings"></section>
      <section class="page" id="p-log"></section>
    </div>
  </main>

  <div class="scrim" id="scrim" role="dialog" aria-modal="true"></div>
  <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
  <script src="/shaders.js"></script>
  <script src="/xterm.js"></script>
  <script src="/panel.js"></script>
</body>
</html>
